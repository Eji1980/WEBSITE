<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Eji Eze Stenlund · Coming soon</title>
<meta name="description" content="The new website of Eji Eze Stenlund, transformational life coach and leadership mentor, is coming soon.">
<meta property="og:title" content="Eji Eze Stenlund · Coming soon">
<meta property="og:description" content="The new website of Eji Eze Stenlund, transformational life coach and leadership mentor, is coming soon.">
<meta property="og:image" content="https://ejiezestenlund.com/eji-hero-bg.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400&family=Inter:wght@400;600&family=Allura&display=swap">
<style>
/* Temporary "coming soon" page for ejiezestenlund.com (see worker.js: COMING_SOON). Same colours and fonts as home.html. */
:root{--navy:#0e1940;--peach:#f3c9a8;--white:#ffffff;
  --display:"Fraunces",Georgia,"Times New Roman",serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--script:"Allura","Snell Roundhand",cursive;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--navy);color:var(--white);font:17px/1.65 var(--body);-webkit-font-smoothing:antialiased}
main{position:relative;min-height:100svh;display:flex;align-items:center;overflow:hidden;padding:48px max(24px,env(safe-area-inset-right,0px)) 48px max(24px,env(safe-area-inset-left,0px))}
.photo{position:absolute;inset:0;background:url("/eji-hero-bg.jpg") 30% 30%/cover no-repeat}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,25,64,.55) 0%,rgba(14,25,64,.8) 50%,var(--navy) 100%)}
.in{position:relative;z-index:1;max-width:1140px;width:100%;margin:0 auto;display:flex;justify-content:flex-end}
.card{max-width:34rem}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:.76rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--peach);margin:0 0 1.3rem}
.kicker::before{content:"";width:28px;height:1.5px;background:currentColor}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.8rem,6.4vw,5rem);line-height:1.05;letter-spacing:-.015em;margin:0 0 .4em}
h1 span{display:block;font-family:var(--script);font-size:.6em;color:var(--peach);letter-spacing:0;line-height:1;margin-top:.15em}
p{margin:0 0 1em;color:rgba(255,255,255,.86);font-size:1.12rem;max-width:30em}
.line{font-family:var(--display);font-style:italic;font-weight:300;font-size:1.35rem;color:var(--white);padding-top:1rem;border-top:1px solid rgba(243,201,168,.5)}
@media (max-width:760px){.photo{inset:0 0 45% 0}.photo::after{background:linear-gradient(180deg,rgba(14,25,64,.35) 0%,var(--navy) 100%)}main{align-items:flex-end}.in{justify-content:flex-start}}
</style>
</head>
<body>
<main>
  <div class="photo" aria-hidden="true"></div>
  <div class="in">
    <div class="card">
      <p class="kicker">Coming soon</p>
      <h1>Eji Eze Stenlund<span>Life Coach &amp; Leadership Mentor</span></h1>
      <p>My new website is on its way. I'm putting the finishing touches on it, and it will open here very soon.</p>
      <p class="line">Thank you for stopping by. See you soon.</p>
    </div>
  </div>
</main>
</body>
</html>
